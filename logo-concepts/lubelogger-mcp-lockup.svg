<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 256" width="760" height="256" role="img" aria-labelledby="title-lockup">
  <title id="title-lockup">LubeLogger MCP Horizontal Lockup</title>
  
  <!-- Left: The Mark with explicit fill-rule="evenodd" -->
  <g id="symbol" fill-rule="evenodd" transform="translate(10, 0)">
    <!-- Steering Wheel Rim -->
    <path fill="#1E293B" d="
      M 128 16
      A 112 112 0 1 0 128.01 16 Z
      M 128 40
      A 88 88 0 1 1 127.99 40 Z
    "/>

    <!-- Left Spoke connecting into the drop -->
    <path fill="#1E293B" d="
      M 40 120
      H 92
      V 136
      H 40
      Z
    "/>

    <!-- Right Spoke connecting into the drop -->
    <path fill="#1E293B" d="
      M 164 120
      H 216
      V 136
      H 164
      Z
    "/>

    <!-- Bottom Spoke connecting to bottom of drop -->
    <path fill="#1E293B" d="
