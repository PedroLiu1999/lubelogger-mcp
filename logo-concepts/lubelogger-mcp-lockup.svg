      A 44 44 0 0 1 84 138
      C 84 104 128 46 128 46 Z
      M 128 110
      C 133 127 141 133 154 138
      C 141 143 133 149 128 166
      C 123 149 115 143 102 138
      C 115 133 123 127 128 110 Z
    "/>
  </g>

  <!-- Right: Wordmark -->
  <text x="270" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#1E293B" letter-spacing="-1.5">lubelogger</text>
  
  <!-- "MCP" Tech Pill Badge -->
  <g transform="translate(615, 96)">
    <rect width="105" height="54" rx="14" fill="#1E293B"/>
    <text x="52" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="28" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="1.5">MCP</text>
    <path fill="#F59E0B" d="M 96 -6 C 98 0 100 2 106 4 C 100 6 98 8 96 14 C 94 8 92 6 86 4 C 92 2 94 0 96 -6 Z"/>
  </g>
