services:
  lubelogger-mcp:
    image: ghcr.io/pedroliu1999/lubelogger-mcp:${LUBELOGGER_MCP_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lubelogger-mcp
    env_file:
      - .env
    environment:
      - PORT=3000
      - DATA_DIR=/data
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
