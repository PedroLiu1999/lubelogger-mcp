<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lubelogger-mcp · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>lubelogger-mcp System Topology</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 568" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">lubelogger-mcp System Topology</title>
        <desc id="architecture-desc">Architecture diagram of lubelogger-mcp connecting AI assistant clients to a self-hosted LubeLogger instance through an embedded OAuth 2.1 layer and MCP server engine.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <!-- Clean paper background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone: lubelogger-mcp (drawn before arrows and nodes) -->
        <rect x="80" y="168" width="800" height="248" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="104" y="172" width="224" height="12" rx="2" fill="#f5f5f5"/>
        <text x="216" y="181" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.14em">LUBELOGGER-MCP (STREAMABLE HTTP SERVER)</text>

        <!-- Connectors (drawn before boxes) -->
        <!-- Connection 1: AI Assistant -> Embedded OAuth 2.1 (PKCE auth flow) -->
        <path d="M 320,80 H 290 Q 282,80 282,88 V 208"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="198" y="142" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="236" y="151" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">PKCE / AUTH</text>

        <!-- Connection 2: AI Assistant -> MCP Server Engine (Primary MCP Streamable HTTP path) -->
        <path d="M 640,80 H 670 Q 678,80 678,88 V 208"
              fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="686" y="142" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="728" y="151" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">STREAMABLE HTTP</text>

        <!-- Connection 3: Embedded OAuth 2.1 <-> MCP Server Engine (Token Verification) -->
        <line x1="452" y1="242" x2="508" y2="242" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="456" y="222" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="480" y="231" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">BEARER</text>

        <!-- Connection 4: MCP Server Engine -> Gateway & Resolver (Tool call dispatch) -->
        <line x1="678" y1="276" x2="678" y2="316" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="686" y="290" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="714" y="299" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">TOOL CALL</text>

        <!-- Connection 5: Gateway & Resolver -> Self-Hosted LubeLogger (REST API) -->
        <line x1="480" y1="384" x2="480" y2="444" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="488" y="408" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="520" y="417" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace"
              text-anchor="middle" letter-spacing="0.06em">REST API</text>

        <!-- Node 1: AI Assistant (Client) -->
        <rect x="320" y="48" width="320" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="48" width="320" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="328" y="54" width="44" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="350" y="63" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
        <text x="480" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">AI Assistant</text>
        <text x="480" y="94" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Claude Desktop · Cursor · Gemini · Custom Agents</text>

        <!-- Node 2A: Embedded OAuth 2.1 (Backend Module) -->
        <rect x="112" y="208" width="340" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="112" y="208" width="340" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="120" y="214" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
        <text x="138" y="223" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AUTH</text>
        <text x="282" y="238" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Embedded OAuth 2.1</text>
        <text x="282" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">RFC 7591 Dyn Reg · PKCE S256 · Persistent TokenStore</text>

        <!-- Node 2B: MCP Server Engine (Focal Node) -->
        <rect x="508" y="208" width="340" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="508" y="208" width="340" height="68" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="516" y="214" width="36" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="534" y="223" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="836" y="266" fill="rgba(191,69,32,0.08)" font-size="28" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">MCP</text>
        <text x="678" y="238" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">MCP Server Engine</text>
        <text x="678" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">7 Read Tools · 5 Deep Facades · 3 Ops Tools</text>

        <!-- Node 2C: LubeLogger Gateway & Resolver -->
        <rect x="112" y="316" width="736" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="112" y="316" width="736" height="68" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="120" y="322" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
        <text x="148" y="331" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">GATEWAY</text>
        <text x="480" y="346" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">LubeLogger Gateway &amp; Resolver</text>
        <text x="480" y="362" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">In-Process Name &amp; Plate Matcher · Fuzzy Levenshtein · In-Memory Cache</text>

        <!-- Node 3: Self-Hosted LubeLogger (Origin / Data) -->
        <rect x="240" y="444" width="480" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="240" y="444" width="480" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="248" y="450" width="48" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="272" y="459" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ORIGIN</text>
        <text x="480" y="474" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Self-Hosted LubeLogger Instance</text>
        <text x="480" y="490" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Vehicles · Gas · Service · Repairs · Reminders · Plans · Supplies</text>

        <!-- Legend strip -->
        <line x1="80" y1="520" x2="880" y2="520" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="80" y="534" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="80" y="540" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="100" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Focal / Core</text>

        <rect x="180" y="540" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="200" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Internal module</text>

        <rect x="300" y="540" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="320" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">External client</text>

        <rect x="420" y="540" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="440" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Origin / store</text>

        <line x1="530" y1="545" x2="554" y2="545" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="562" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">MCP stream</text>

        <line x1="640" y1="545" x2="664" y2="545" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="672" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">REST API</text>

        <line x1="740" y1="545" x2="764" y2="545" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="772" y="548" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Auth / token</text>
      </svg>
    </div>
  </div>
</body>
</html>
